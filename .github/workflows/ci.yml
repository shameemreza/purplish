name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpcs:
    name: PHPCS and PHPCompatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The plugin skeleton adds composer.json. Until then this job has
      # nothing to check.
      - name: Check for Composer
        id: tooling
        run: echo "ready=$( test -f composer.json && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.tooling.outputs.ready == 'yes'
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer packages
        if: steps.tooling.outputs.ready == 'yes'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS
        if: steps.tooling.outputs.ready == 'yes'
        run: vendor/bin/phpcs -q

      - name: PHPCompatibility (PHP 7.4 and later)
        if: steps.tooling.outputs.ready == 'yes'
        run: composer lint:compat

  js:
    name: JavaScript tests, lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check for npm
        id: tooling
        run: echo "ready=$( test -f package.json && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      # The repo pins Node in .nvmrc. @wordpress/scripts needs Node 22.
      - uses: actions/setup-node@v7
        if: steps.tooling.outputs.ready == 'yes'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm packages
        if: steps.tooling.outputs.ready == 'yes'
        run: npm ci

      - name: JavaScript tests
        if: steps.tooling.outputs.ready == 'yes'
        run: npm run test:js

      - name: Lint JavaScript
        if: steps.tooling.outputs.ready == 'yes'
        run: npm run lint:js

      - name: Lint styles
        if: steps.tooling.outputs.ready == 'yes'
        run: npm run lint:css

      - name: Build
        if: steps.tooling.outputs.ready == 'yes'
        run: npm run build

  phpunit:
    name: PHPUnit on PHP ${{ matrix.php }}, WooCommerce ${{ matrix.woocommerce }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
        woocommerce: [ 'latest-stable' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Composer stops a script after 300 seconds unless told otherwise.
      COMPOSER_PROCESS_TIMEOUT: 0
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_NAME: purplish_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_HOST: 127.0.0.1
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce }}

    steps:
      - uses: actions/checkout@v7

      - name: Check for PHPUnit
        id: tooling
        run: echo "ready=$( test -f phpunit.xml.dist && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.tooling.outputs.ready == 'yes'
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, imagick
          coverage: none
          tools: composer:v2

      - name: Install Composer packages
        if: steps.tooling.outputs.ready == 'yes'
        run: composer install --no-interaction --no-progress --prefer-dist

      # WordPress core matches the wp-phpunit test library Composer installed.
      - name: Install WordPress and the test database
        if: steps.tooling.outputs.ready == 'yes'
        run: bin/install-wp-tests.sh "$WP_TESTS_DB_NAME" "$WP_TESTS_DB_USER" "$WP_TESTS_DB_HOST" "$(composer show wp-phpunit/wp-phpunit --format=json | jq -r '.versions[0]')"

      - name: Install WooCommerce
        if: steps.tooling.outputs.ready == 'yes'
        run: |
          curl -fsSL "https://downloads.wordpress.org/plugin/woocommerce.${WOOCOMMERCE_VERSION}.zip" -o /tmp/woocommerce.zip
          unzip -q /tmp/woocommerce.zip -d "$WP_CORE_DIR/wp-content/plugins/"

      - name: PHPUnit
        if: steps.tooling.outputs.ready == 'yes'
        run: composer test

  # The one check branch protection requires. Its name never changes, so
  # moving the WooCommerce or PHP versions in the matrix never blocks a PR.
  ci-passed:
    name: CI passed
    if: always()
    needs: [ phpcs, js, phpunit ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job passed
        run: |
          test "${{ needs.phpcs.result }}" = success
          test "${{ needs.js.result }}" = success
          test "${{ needs.phpunit.result }}" = success
